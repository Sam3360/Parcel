[workspace]
resolver = "2"
members = ["crates/parcel-core", "crates/parcel-workspace", "crates/parcel-cli", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
parcel-core = { path = "crates/parcel-core" }

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
